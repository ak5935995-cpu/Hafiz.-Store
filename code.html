<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HAFIZ STORE - Digital Marketing Agency. SEO, Social Media Marketing, Ads, and Brand Growth solutions.">
  <title>HAFIZ STORE | Digital Marketing Agency</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7c3aed;
      --primary-dark: #5b21b6;
      --accent: #f59e0b;
      --text: #1f2937;
      --text-light: #6b7280;
      --bg: #ffffff;
      --bg-alt: #f5f3ff;
      --radius: 14px;
      --max-width: 1100px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    img { max-width: 100%; display: block; }

    /* ===== Header ===== */
    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
      z-index: 100;
    }

    nav {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      text-decoration: none;
      color: var(--primary);
    }

    .logo span { color: var(--accent); }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--primary); }

    /* ===== Hero ===== */
    .hero {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      text-align: center;
      padding: 6.5rem 1.5rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin-bottom: 1rem;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      font-size: 1.15rem;
      max-width: 620px;
      margin: 0 auto 2rem;
      opacity: 0.92;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 2.2rem;
      background: var(--accent);
      color: #1f2937;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      text-decoration: none;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    }
